name : calculator ci

on :
  push

jobs :
  webhook:
    runs-on : ubuntu-latest
    env :
      WEBHOOK_URL : ${{secrets.WEBHOOK_URL}}
    
    steps :
      - name : checkout repository
        uses : actions/checkout@v4

      - name : Docke image
        id : build
        run : docker build -t githubbuild .

      - name : docker test
        id : test
        run : |
          result=$(docker run githubbuild)
          echo "result=$result" >> $GITHUB_OUTPUT

      - name : print test
        run: echo "Test output:${{ steps.test.outputs.result }}"


      # - name : docker container
      #   id : test
      #   run : docker run --name githubrun githubbuild

      - name : workflow failure
        if : ${{failure() && steps.test.outcome == "failure"}}
        run : |
          curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{"project":"webhook","status":"failed"}'
 